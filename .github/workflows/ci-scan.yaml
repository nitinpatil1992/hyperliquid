name: CI and Security Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'Trivy-Config'
      
      - name: Scan Helm charts
        run: |
          mkdir rendered
          helm repo add bjw-s-labs https://bjw-s-labs.github.io/helm-charts/ && \
          helm repo update && \
          helm dependency build charts/hyperliquid-node && \
          helm template charts/hyperliquid-node --namespace hyperliquid -f charts/hyperliquid-node/values.yaml > rendered/rendered.yaml
          if [ -s rendered/rendered.yaml ]; then
            docker run --rm -i -v $(pwd)/rendered:/project aquasec/trivy config --severity HIGH,CRITICAL  /project
          else
            echo "No Helm template output to scan"
          fi
      
      - name: Build Docker testnet image
        run: |
          docker build -t hl-visor:test -f app/Dockerfile app/
      
      - name: Build Docker mainnet image
        run: |
          docker build -t hl-visor:mainnet --build-arg CHAIN=Mainnet -f app/Dockerfile app/
      
      - name: Run Trivy hl-visor:test image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hl-visor:test'
          format: 'sarif'
          output: 'trivy-image-test-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy hl-visor:mainnet image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hl-visor:mainnet'
          format: 'sarif'
          output: 'trivy-image-mainnet-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy testnet image results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image-test-results.sarif'
          category: 'Trivy-Testnet-Image'

      - name: Upload Trivy mainnet image results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image-mainnet-results.sarif'
          category: 'Trivy-Mainnet-Image'
