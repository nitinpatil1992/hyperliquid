name: Continuous Delivery

on:
  workflow_run:
    workflows: ["CI and Security Scan"]
    branches: [master]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/hl-visor

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHAIN=Mainnet

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/

      - name: Sync ArgoCD Application
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          argocd login $ARGOCD_SERVER --sso --grpc-web --auth-token $ARGOCD_AUTH_TOKEN
          argocd app set hyperliquid-node \
            -p controllers.main.containers.main.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/hl-visor \
            -p controllers.main.containers.main.image.tag=$IMAGE_TAG  \
            -p controllers.main.initContainers.init-validator.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/hl-visor \
            -p controllers.main.initContainers.init-validator.image.tag=$IMAGE_TAG            
          argocd app sync hyperliquid-node --prune --timeout 300 # we can disable this if we want to take controlled action
          # argocd app wait hyperliquid-node --timeout 300 --health  # initial block construction will take bit of time so excluded